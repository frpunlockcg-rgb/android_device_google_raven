name: Build Check

on:
  push:
    branches: [ "raven-user-13-TP1A.221005.002-9012097-release-keys" ]
  pull_request:
    branches: [ "raven-user-13-TP1A.221005.002-9012097-release-keys" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        ndk-version: r26c

    - name: Check device tree syntax
      run: |
        echo "Validating Android.mk and Android.bp files..."
        # Basic syntax validation
        test -f Android.mk && echo "Android.mk exists"
        test -f Android.bp && echo "Android.bp exists"
        test -f BoardConfig.mk && echo "BoardConfig.mk exists"
        test -f device.mk && echo "device.mk exists"

    - name: Validate makefiles
      run: |
        # Check for common syntax issues in makefiles
        for f in *.mk; do
          if [ -f "$f" ]; then
            echo "Checking $f..."
            # Basic check - no unclosed conditionals, etc.
            make -n -f "$f" 2>/dev/null || true
          fi
        done
